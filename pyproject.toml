[project]
name = "tea-shop-webhook"
version = "1.0.0"
description = "Telegram-бот «Чайный магазин»: Aiogram 3, WebApp, webhook/ngrok, SQLAlchemy, SQLite/Supabase, Streamlit"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15,<4.0",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",
    "SQLAlchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "streamlit>=1.49",
    "pandas>=2.2.3",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
